[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-harness-bridge"
version = "1.3.0"
description = "A local, project-scoped mailbox and handoff system for AI development harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
a2a = ["a2a-sdk[http-server]>=1.3,<2", "uvicorn>=0.30,<1"]
claude = ["claude-agent-sdk>=0.2.186,<0.3"]
test = ["pytest>=8,<10"]

[project.scripts]
mhb = "multi_harness_bridge.cli:main"
multi-harness-bridge = "multi_harness_bridge.cli:main"
multi-harness-wake = "multi_harness_bridge.wake:main"
multi-harness-telegram = "multi_harness_bridge.telegram:main"
multi-harness-service = "multi_harness_bridge.services:main"
multi-harness-skills = "multi_harness_bridge.skills:main"
multi-harness-claude-hook = "multi_harness_bridge.role_adapters:claude_hook_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multi_harness_bridge = ["builtin_skills/*/SKILL.md", "assets/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
